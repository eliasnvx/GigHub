prefix: "&8[&6GigHub&8]"

# General Messages
general:
  no-permission: "{prefix} &cУ вас нет прав для использования этой команды!"
  player-only: "{prefix} &cЭту команду может использовать только игрок!"
  invalid-usage: "{prefix} &cНеверное использование! {usage}"
  unknown-command: "{prefix} &cНеизвестная подкоманда!"

# GUI Messages
gui:
  contract-creation:
    title: "&6Создание контракта"
    select-type: "&eВыберите тип контракта"
    enter-title: "&7Введите название контракта в чат:"
    enter-description: "&7Введите описание контракта в чат:"
    enter-reward: "&7Введите вознаграждение в чат:"
    enter-deadline: "&7Введите срок в днях (0 без срока):"
    select-location: "&7Нажмите для выбора локации (для строительных контрактов)"
    confirm-create: "&aНажмите для подтверждения создания"
    cancel-create: "&cНажмите для отмены"
    insufficient-funds: "{prefix} &cНедостаточно средств! Требуется: ${amount}"
    contract-created: "{prefix} &aКонтракт создан успешно! ID: #{id}"
    error-creating: "{prefix} &cОшибка создания контракта: {error}"
    type: "&eТип контракта"
    type-not-selected: "&cНе выбран"
    click-type: "&7Нажмите для выбора типа контракта"
    title: "&eНазвание"
    title-not-set: "&cНе установлено"
    click-title: "&7Нажмите для установки названия"
    description: "&eОписание"
    description-not-set: "&cНе установлено"
    click-description: "&7Нажмите для установки описания"
    reward: "&eВознаграждение"
    reward-not-set: "&cНе установлено"
    click-reward: "&7Нажмите для установки вознаграждения"
    deadline: "&eСрок"
    deadline-not-set: "&cНе установлен"
    click-deadline: "&7Нажмите для установки срока"
    location: "&eЛокация"
    location-not-set: "&cНе установлена"
    click-location: "&7Нажмите для выбора локации"
    submit: "&aСоздать контракт"
    submit-ready: "&7Нажмите для создания контракта"
    submit-disabled: "&cСоздать контракт"
    submit-not-ready: "&7Заполните все обязательные поля"
    cancel: "&cОтмена"
    cancel-lore: "&7Нажмите для отмены создания"
    fill-required: "{prefix} &cПожалуйста, заполните все обязательные поля!"
    location-set: "&aЛокация установлена!"
    success: "{prefix} &aКонтракт создан успешно!"
    error: "{prefix} &cОшибка создания контракта!"

# Contract Types
contract-types:
  item_request: "&bЗапрос предмета"
  building: "&eСтроительство"
  combat: "&cБоевые задачи"
  mining: "&7Добыча ресурсов"
  farming: "&aСбор урожая"
  custom: "&dОсобые задачи"
  auto-verify: "&7Автопроверка:"

# Time Messages
time:
  days: "{days}д"
  hours: "{hours}ч"
  minutes: "{minutes}м"
  seconds: "{seconds}с"
  expired: "&cИстёк"
  no-deadline: "&7Без срока"

# Common Values
common:
  none: '&7Нет'
  unknown: '&7Неизвестно'
  affirmative: '&aДа'
  negative: '&cНет'
  enabled: "&aВключено"
  disabled: "&cВыключено"
  click-to-view: "&eНажмите для просмотра"
  click-to-edit: "&eНажмите для редактирования"
  back: "&cНазад"
  close: "&cЗакрыть"
  next: "&aДалее →"
  previous: "← Назад"
  page: "Страница {current}/{total}"

# Commands
commands:
  gig:
    help:
      header: "&6=== Команды GigHub ==="
      create: "&e/gig create &7- Создать новый контракт"
      list: "&e/gig list [страница] &7- Список всех контрактов"
      my: "&e/gig my &7- Ваши контракты"
      accept: "&e/gig accept <id> &7- Принять контракт"
      complete: "&e/gig complete <id> &7- Отметить контракт выполненным"
      cancel: "&e/gig cancel <id> &7- Отменить ваш контракт"
      footer: "&6========================"
    
    list:
      header: "&6=== Доступные контракты (Страница {page}) ==="
      no-contracts: "&7Контракты не найдены."
      contract-item: |
        &e#{id} &7- &f{title}
        &7  Тип: {type} &7| Награда: ${reward}
        &7  Нажмите для деталей...
    
    my:
      header: "&6=== Ваши контракты ==="
      no-contracts: "&7У вас нет контрактов."
      owner: "&7Владелец: {owner}"
      contractor: "&7Исполнитель: {contractor}"
      
    accept:
      already-accepted: "{prefix} &cВы уже приняли этот контракт!"
      success: "{prefix} &aКонтракт принят! Используйте /gig complete {id} при завершении."
      
    complete:
      not-contractor: "{prefix} &cТолько исполнитель может завершать контракты!"
      success: "{prefix} &aКонтракт отмечен как выполненный! Ожидайте проверки..."
      
    cancel:
      not-owner: "{prefix} &cТолько владелец может отменять контракты!"
      success: "{prefix} &aКонтракт отменён, средства возвращены."

# Errors
errors:
  contract-not-found: "{prefix} &cКонтракт не найден!"
  insufficient-funds: "{prefix} &cНедостаточно средств!"
  already-have-contract: "{prefix} &cУ вас уже есть активный контракт!"
  invalid-number: "{prefix} &cНеверное число!"
  invalid-deadline: "{prefix} &cСрок должен быть положительным числом!"
  building-requires-location: "{prefix} &cСтроительные контракты требуют указания локации!"

# Success Messages
success:
  reloaded: "{prefix} &aКонфигурация перезагружена!"
  saved: "{prefix} &aДанные сохранены успешно!"
  
# Notifications
notifications:
  contract-accepted: "&aВаш контракт принят игроком {player}!"
  contract-completed: "&aКонтракт выполнен игроком {player}!"
  contract-cancelled: "&cКонтракт отменён!"
  funds-escrowed: "&7${amount} помещены в эскроу."
  funds-released: "&7${amount} выплачены игроку {player}."
  funds-refunded: "&7${amount} возвращены игроку {player}."
